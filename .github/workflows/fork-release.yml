name: Fork release
on:
  push:
    tags: ['cathul-v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fork-release
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    if: github.repository == 'cathul/polka'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify release version
        id: version
        shell: bash
        run: |
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$GITHUB_REF" = refs/heads/develop
          else
            test "$GITHUB_REF_NAME" = "cathul-v$version"
          fi
          test -f "docs/releases/$version.md"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Create or verify release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          tag="cathul-v$RELEASE_VERSION"
          if existing=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null); then
            test "$existing" = "$GITHUB_SHA"
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
          fi
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}
          tags: |
            ghcr.io/cathul/polka:${{ steps.version.outputs.value }}
            ghcr.io/cathul/polka:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: cathul-v${{ steps.version.outputs.value }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --title "Polka $RELEASE_VERSION" \
            --notes-file "docs/releases/$RELEASE_VERSION.md" compose.yaml
