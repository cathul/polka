name: Develop Docker

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested develop image to this fork's GHCR
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  docker:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: VERSION=0.1-develop-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/develop' && github.repository != 'vestigiumincaligne/polka'
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=0.1-develop-${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.name }}:develop-0.1-${{ github.sha }}
            ${{ steps.image.outputs.name }}:develop
          cache-from: type=gha
