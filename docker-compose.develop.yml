# Separate trial deployment. Never mount the production data directory here.
services:
  polka:
    image: polka:develop-0.1-local
    build:
      context: .
      args:
        VERSION: "0.1"
    ports:
      - "${POLKA_BIND_IP:-127.0.0.1}:${POLKA_BIND_PORT:-12792}:12791"
    environment:
      POLKA_DATA_DIR: /data
      POLKA_LIBRARY_DIR: /books
      POLKA_ADDR: :12791
    volumes:
      - polka-develop-data:/data
      - ${POLKA_BOOKS_PATH:?Set the absolute path to your book library}:/books:ro
    restart: "no"

volumes:
  polka-develop-data:
