name: polka-fork
services:
  polka:
    image: ghcr.io/cathul/polka:0.1
    ports:
      - "${POLKA_BIND_IP:-127.0.0.1}:${POLKA_BIND_PORT:-12791}:12791"
    environment:
      POLKA_DATA_DIR: /data
      POLKA_LIBRARY_DIR: /books
      POLKA_ADDR: :12791
    volumes:
      - polka-data:/data
      - type: bind
        source: ${POLKA_BOOKS_PATH:?Set POLKA_BOOKS_PATH in .env}
        target: /books
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
volumes:
  polka-data:
